<div style="width: 1000px; height: 1000px">
  <mat-grid-list cols="10" rowHeight="100px">
    @for (row of boardState.rows; track row.cells) {
      @for (cell of row.cells; track cell.control) {
        <mat-grid-tile
          class="board-cell"
          [ngClass]="{
            'black-control': cell.control === boardStateService.CellControlState.BLACK,
            'white-control': cell.control === boardStateService.CellControlState.WHITE,
            'no-control': cell.control === boardStateService.CellControlState.FREE,
          }"
        ></mat-grid-tile>
      }
    }
  </mat-grid-list>
</div>

<div>{{ boardState | json }}</div>
